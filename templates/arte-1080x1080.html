<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>arte-01</title>
<style>
  /* Design system FIXO da Conexão — ver .claude/skills/aplicador-marca-conexao/SKILL.md */
  @font-face { font-family: 'Inter'; font-weight: 300; src: url('assets/fonts/inter-300.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('assets/fonts/inter-400.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('assets/fonts/inter-600.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('assets/fonts/inter-700.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 900; src: url('assets/fonts/inter-900.woff2') format('woff2'); }

  :root {
    --bg: #0f172a; --bg-deep: #0a0f1e; --bg-glow: #16213a;
    --surface: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
    --border-subtle: #1e293b; --accent: #e5c158;
    --gradiente-assinatura: linear-gradient(135deg, #d4af37 0%, #fff3ad 25%, #e5c158 50%, #fff8d6 75%, #caa146 100%);
    --glow-blue: #148ecb; /* uso exclusivo: glows decorativos de fundo, nunca texto/botao/card */
    --fonte-titulo: 'Inter', 'Roboto', sans-serif;
    --fonte-corpo: 'Inter', 'Roboto', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    font-family: var(--fonte-corpo); color: var(--text-main); position: relative;
    background:
      radial-gradient(ellipse 70% 55% at 50% 22%, var(--bg-glow) 0%, transparent 62%),
      radial-gradient(ellipse 90% 80% at 50% 100%, var(--bg-deep) 0%, var(--bg) 50%);
  }

  .glow { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(70px); }
  .glow-1 { width: 420px; height: 420px; top: -120px; right: -100px; background: radial-gradient(circle, rgba(20,142,203,0.24), transparent 70%); }
  .glow-2 { width: 340px; height: 340px; bottom: -100px; left: -90px; background: radial-gradient(circle, rgba(20,142,203,0.14), transparent 70%); }

  .barra-topo { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--gradiente-assinatura); box-shadow: 0 0 8px rgba(255, 243, 173, 0.4); z-index: 2; }

  .logo { position: absolute; top: 40px; left: 48px; max-height: 70px; max-width: 220px; z-index: 2; }

  .badge { position: absolute; top: 40px; right: 48px; border: 1px solid var(--accent); border-radius: 999px; padding: 0.4rem 1.1rem; font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); z-index: 2; }

  .produto {
    position: absolute; top: 130px; left: 50%; transform: translateX(-50%);
    width: 640px; max-height: 500px; object-fit: contain; z-index: 1;
  }

  .texto { position: absolute; left: 48px; right: 48px; bottom: 130px; z-index: 2; }
  .texto h1 {
    font-family: var(--fonte-titulo); font-weight: 900; font-size: 3.1rem; line-height: 1.1; margin-bottom: 0.6rem;
    background: var(--gradiente-assinatura); background-clip: text; -webkit-background-clip: text; color: transparent;
  }
  .texto p.subcopy { font-family: var(--fonte-corpo); font-size: 1.3rem; color: var(--text-muted); margin-bottom: 1rem; max-width: 44ch; }

  .marca { position: absolute; bottom: 28px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: center; font-family: var(--fonte-corpo); font-size: 1.1rem; font-weight: 700; color: var(--text-main); z-index: 2; }
  .marca .cta { background: var(--gradiente-assinatura); color: var(--bg); font-weight: 700; padding: 0.5rem 1.2rem; border-radius: 999px; font-size: 1rem; }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="barra-topo"></div>

  <!-- {{LOGO}} -- compilador-arte substitui (opcional): <img class="logo" src="..."> -->
  <!-- {{BADGE_CONTEXTO}} -- compilador-arte substitui: <span class="badge">USO INTERNO|USO PROFISSIONAL</span> -->

  <!-- {{IMAGEM_PRODUTO}} -- compilador-arte substitui: <img class="produto" src="..."> (conteudo.imagem_produto, nunca ilustracao gerada) -->

  <div class="texto">
    <!-- {{HEADLINE}} -- compilador-arte substitui: <h1>headline</h1> -->
    <!-- {{SUBCOPY}} -- compilador-arte substitui: <p class="subcopy">subcopy</p> -->
  </div>

  <div class="marca">
    <span>{{NOME_MARCA}}</span>
    <!-- {{CTA}} -- compilador-arte substitui: <span class="cta">cta</span> -->
  </div>
</body>
</html>
